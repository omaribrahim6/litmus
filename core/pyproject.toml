[project]
name = "litmus-core"
version = "0.1.0"
description = "Deterministic signal processing shared by the Litmus station and worker"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["litmus_core*"]
